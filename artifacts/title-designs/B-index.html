</style><main><header><h1>시즌 기록실</h1><small>B / 기록실 색인형 · 예시 기록</small></header><div class="layout"><nav class="choices" aria-label="칭호 선택"><button aria-pressed="false">킬딸 왕</button><button aria-pressed="true">유미 체질</button><button aria-pressed="false">실력그래프 1등</button></nav><section class="records" aria-live="polite"><h2>유미 체질</h2><table><thead><tr><th>순위</th><th>선수</th><th id="unit">세트당 어시스트</th><th>표본</th></tr></thead><tbody><tr><td>공동 1</td><td>새벽두시</td><td>12.4</td><td>18세트</td></tr><tr><td>공동 1</td><td>돌멩이</td><td>12.4</td><td>15세트</td></tr></tbody></table></section></div><div class="series"><small>Bo3</small><strong>삼꽉의 악마</strong><span>바나나킥</span><b>패 · 승 · 승</b></div></main><footer><a href="A-broadcast.html">A · 중계 자막</a><a href="C-editorial.html">C · 경기 기사</a></footer><script>
