<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#050A14" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#F4F0E6" media="(prefers-color-scheme: light)" />
		<script>
			// 첫 페인트 전에 저장된 모드 또는 시스템 설정을 적용한다. 저장 키는 'theme-mode'이며, 이전 값('primary')은 무시하고 시스템 설정으로 되돌린다.
			(() => {
				let saved = null;
				try {
					saved = localStorage.getItem('theme-mode');
				} catch {
					// 저장소를 막은 브라우저에서는 시스템 설정을 쓴다.
				}
				const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.mode = saved === 'dark' || saved === 'light' ? saved : system;
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Noto+Sans+KR:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/png" sizes="128x128" href="%sveltekit.assets%/brand/favicon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
