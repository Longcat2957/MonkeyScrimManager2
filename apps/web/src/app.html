<!doctype html>
<html lang="ko" data-mode="primary">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// 첫 화면이 그려지기 전에 저장된 테마를 복원한다.
			try {
				const mode = localStorage.getItem('theme-mode');
				if (mode === 'primary' || mode === 'dark') {
					document.documentElement.dataset.mode = mode;
				}
			} catch {
				// 브라우저가 저장소 접근을 막으면 기본 테마를 사용한다.
			}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/png" sizes="128x128" href="%sveltekit.assets%/brand/favicon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
