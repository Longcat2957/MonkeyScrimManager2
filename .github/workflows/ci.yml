name: CI

on:
    push:
        branches: [dev]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        steps:
            - name: 저장소 읽기
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: pnpm 준비
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  version: 10.20.0
                  run_install: false
            - name: Node.js 준비
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            - name: 잠금 파일로 의존성 설치
              run: pnpm install --frozen-lockfile
            - name: 정적 검사 및 기본 웹·봇 테스트
              run: |
                  pnpm check &
                  check_pid=$!
                  pnpm test &
                  test_pid=$!
                  status=0
                  wait "$check_pid" || status=1
                  wait "$test_pid" || status=1
                  exit "$status"
            - name: Docker Buildx 준비
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: 이미지 이름 준비
              run: echo "MSM2_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
            - name: GHCR 로그인
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: 공통 이미지 빌드·발행
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  target: runtime
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.MSM2_IMAGE }}:dev
                      ${{ env.MSM2_IMAGE }}:${{ github.sha }}
                  build-args: REVISION=${{ github.sha }}
                  cache-from: type=gha,scope=monkeybot
                  cache-to: type=gha,mode=max,scope=monkeybot
