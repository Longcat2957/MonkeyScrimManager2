name: monkeybot

x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '3'

services:
    postgres:
        # 최초 이관에서는 기존 VPS와 같은 이미지·데이터 디렉터리를 사용한다.
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        restart: unless-stopped
        env_file:
            - ${MSM2_ENV_DIR:-/etc/monkeybot}/postgres.env
        ports:
            - 127.0.0.1:${MSM2_POSTGRES_PORT:-10010}:5432
        volumes:
            - type: volume
              source: postgres-data
              target: /var/lib/postgresql
        networks:
            data:
            # 기존 DB 이용자와 SSH 터널의 접속 경로를 보존한다.
            legacy-data:
                aliases:
                    - postgres
            tunnel:
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            start_period: 20s
            retries: 5
        shm_size: 128mb
        stop_grace_period: 60s
        logging: *logging

    caddy:
        image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
        restart: unless-stopped
        environment:
            MSM2_CADDY_HANDLER: maintenance.caddy
        ports:
            # 호스트 IP를 생략하면 기존 VPS처럼 IPv4·IPv6 모두에 게시한다.
            - ${MSM2_HTTP_PUBLISH:-80:80}
            - ${MSM2_HTTPS_PUBLISH:-443:443}
            - ${MSM2_HTTP3_PUBLISH:-443:443/udp}
        volumes:
            - type: bind
              source: ./caddy
              target: /etc/caddy
              read_only: true
              bind:
                  create_host_path: false
                  selinux: Z
            # 인증서·계정·갱신 상태는 컨테이너를 재생성해도 보존한다.
            - caddy-data:/data
            - caddy-config:/config
        networks:
            - edge
        healthcheck:
            test: ['CMD', 'wget', '-qO-', '--header', 'Host: monkeybot.lol', 'http://127.0.0.1/healthz']
            interval: 10s
            timeout: 5s
            retries: 3
        stop_grace_period: 15s
        logging: *logging

networks:
    edge:
    data:
        internal: true
    legacy-data:
        external: true
        name: ${MSM2_LEGACY_DATA_NETWORK:-deploy_data}
    tunnel:
        external: true
        name: ${MSM2_TUNNEL_NETWORK:-monkeybot_tunnel}

volumes:
    caddy-data:
        name: monkeybot-caddy-data
    caddy-config:
        name: monkeybot-caddy-config
    # 기존 볼륨이 없으면 새 빈 DB를 만들지 않고 실패한다.
    postgres-data:
        external: true
        name: ${MSM2_POSTGRES_VOLUME:-monkeybot-postgres-data}
