# 이미지와 서비스 환경 파일이 준비된 릴리스에서 compose.yml과 함께 사용한다.
x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '3'

services:
    migrate:
        image: ${MSM2_APP_IMAGE:?MSM2_APP_IMAGE에 CI에서 만든 공통 이미지를 설정해 주세요}
        working_dir: /app/apps/web
        command: ['node', 'node_modules/drizzle-kit/bin.cjs', 'migrate']
        restart: 'no'
        env_file:
            - path: ${MSM2_ENV_DIR:-/etc/monkeybot}/migration.env
              format: raw
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - data
        logging: *logging

    web:
        image: ${MSM2_APP_IMAGE:?MSM2_APP_IMAGE에 CI에서 만든 공통 이미지를 설정해 주세요}
        working_dir: /app/apps/web
        command: ['node', 'build/index.js']
        restart: unless-stopped
        env_file:
            - path: ${MSM2_ENV_DIR:-/etc/monkeybot}/web.env
              format: raw
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: '3000'
            PROTOCOL_HEADER: x-forwarded-proto
            BODY_SIZE_LIMIT: 70M
            SHUTDOWN_TIMEOUT: '25'
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        networks:
            - edge
            - data
        healthcheck:
            test: ['CMD', 'node', 'scripts/healthcheck.mjs']
            interval: 10s
            timeout: 10s
            start_period: 20s
            retries: 5
        stop_grace_period: 35s
        logging: *logging

    bot:
        image: ${MSM2_APP_IMAGE:?MSM2_APP_IMAGE에 CI에서 만든 공통 이미지를 설정해 주세요}
        working_dir: /app/apps/bot
        command: ['node', 'dist/index.js']
        restart: unless-stopped
        env_file:
            - path: ${MSM2_ENV_DIR:-/etc/monkeybot}/bot.env
              format: raw
        environment:
            NODE_ENV: production
            BOT_API_URL: http://web:3000
            WEB_ORIGIN: https://monkeybot.lol
            BOT_STATUS_PORT: '3101'
            BOT_STATUS_HOST: 0.0.0.0
        depends_on:
            web:
                condition: service_healthy
        networks:
            - edge
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - fetch('http://127.0.0.1:3101/status',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(s=>{if(!s.ready)process.exit(1)}).catch(()=>process.exit(1))
            interval: 10s
            timeout: 5s
            start_period: 60s
            retries: 6
        stop_grace_period: 45s
        logging: *logging

    prometheus:
        image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
        restart: unless-stopped
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'
        volumes:
            - type: bind
              source: ./prometheus
              target: /etc/prometheus
              read_only: true
              bind:
                  create_host_path: false
                  selinux: Z
            - prometheus-data:/prometheus
        depends_on:
            web:
                condition: service_healthy
        networks:
            - edge
        stop_grace_period: 30s
        logging: *logging

    grafana:
        image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
        restart: unless-stopped
        env_file:
            - path: ${MSM2_ENV_DIR:-/etc/monkeybot}/grafana.env
              format: raw
        environment:
            GF_SERVER_ROOT_URL: https://monkeybot.lol/grafana/
            GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
            GF_SECURITY_COOKIE_SECURE: 'true'
            GF_USERS_ALLOW_SIGN_UP: 'false'
            GF_USERS_ALLOW_ORG_CREATE: 'false'
            GF_AUTH_ANONYMOUS_ENABLED: 'false'
            GF_ANALYTICS_REPORTING_ENABLED: 'false'
            GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
            GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
            GF_NEWS_NEWS_FEED_ENABLED: 'false'
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/msm2.json
        volumes:
            - type: bind
              source: ./grafana/provisioning
              target: /etc/grafana/provisioning
              read_only: true
              bind:
                  create_host_path: false
                  selinux: Z
            - type: bind
              source: ./grafana/dashboards
              target: /var/lib/grafana/dashboards
              read_only: true
              bind:
                  create_host_path: false
                  selinux: Z
            - grafana-data:/var/lib/grafana
        depends_on:
            prometheus:
                condition: service_started
        networks:
            - edge
        stop_grace_period: 15s
        logging: *logging

    caddy:
        environment:
            MSM2_CADDY_HANDLER: application.caddy
        depends_on:
            web:
                condition: service_healthy
            grafana:
                condition: service_started

volumes:
    prometheus-data:
        name: monkeybot-prometheus-data
    grafana-data:
        name: monkeybot-grafana-data
