# 이미지와 서비스 환경 파일이 준비된 릴리스에서 compose.yml과 함께 사용한다.
x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '3'

services:
    migrate:
        image: ${MSM2_APP_IMAGE:?MSM2_APP_IMAGE에 CI에서 만든 공통 이미지를 설정해 주세요}
        working_dir: /app/apps/web
        command: ['node', 'node_modules/drizzle-kit/bin.cjs', 'migrate']
        restart: 'no'
        env_file:
            - path: ${MSM2_ENV_DIR:-/etc/monkeybot}/migration.env
              format: raw
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - data
        logging: *logging

    web:
        image: ${MSM2_APP_IMAGE:?MSM2_APP_IMAGE에 CI에서 만든 공통 이미지를 설정해 주세요}
        working_dir: /app/apps/web
        command: ['node', 'build/index.js']
        restart: unless-stopped
        env_file:
            - path: ${MSM2_ENV_DIR:-/etc/monkeybot}/web.env
              format: raw
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: '3000'
            PROTOCOL_HEADER: x-forwarded-proto
            BODY_SIZE_LIMIT: 70M
            SHUTDOWN_TIMEOUT: '25'
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        networks:
            - edge
            - data
        healthcheck:
            test: ['CMD', 'node', 'scripts/healthcheck.mjs']
            interval: 10s
            timeout: 10s
            start_period: 20s
            retries: 5
        stop_grace_period: 35s
        logging: *logging

    bot:
        image: ${MSM2_APP_IMAGE:?MSM2_APP_IMAGE에 CI에서 만든 공통 이미지를 설정해 주세요}
        working_dir: /app/apps/bot
        command: ['node', 'dist/index.js']
        restart: unless-stopped
        env_file:
            - path: ${MSM2_ENV_DIR:-/etc/monkeybot}/bot.env
              format: raw
        environment:
            NODE_ENV: production
            BOT_API_URL: http://web:3000
            WEB_ORIGIN: https://monkeybot.lol
            BOT_STATUS_PORT: '3101'
            BOT_STATUS_HOST: 0.0.0.0
        depends_on:
            web:
                condition: service_healthy
        networks:
            - edge
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - fetch('http://127.0.0.1:3101/status',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(s=>{if(!s.ready)process.exit(1)}).catch(()=>process.exit(1))
            interval: 10s
            timeout: 5s
            start_period: 60s
            retries: 6
        stop_grace_period: 45s
        logging: *logging

    nginx:
        volumes:
            - type: bind
              source: ./nginx/application.conf
              target: /etc/nginx/conf.d/default.conf
              read_only: true
              bind:
                  create_host_path: false
                  selinux: Z
        depends_on:
            web:
                condition: service_healthy
