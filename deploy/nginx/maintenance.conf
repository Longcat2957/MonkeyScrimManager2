include /etc/nginx/monkeybot-common/*.conf;

# 앱 이미지가 준비되기 전에는 기존 중단 응답을 유지한다.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name monkeybot.lol;
    ssl_certificate /etc/nginx/certs/monkeybot-origin.pem;
    ssl_certificate_key /etc/nginx/certs/monkeybot-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    # 이 응답은 nginx의 생존 확인이며 앱·DB의 준비 상태를 뜻하지 않는다.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 503 "Service discontinued.\n";
    }
}
