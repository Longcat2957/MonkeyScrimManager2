include /etc/nginx/monkeybot-common/*.conf;

server {
    listen 80;
    server_name monkeybot.lol;
    access_log off;

    # Compose의 nginx 생존 확인이며 앱·DB 준비 상태 검사와 구분한다.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://monkeybot.lol$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name monkeybot.lol;
    ssl_certificate /etc/nginx/certs/monkeybot-origin.pem;
    ssl_certificate_key /etc/nginx/certs/monkeybot-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    # 컨테이너 재생성으로 웹 주소가 바뀌어도 Docker DNS로 다시 조회한다.
    set $web_upstream http://web:3000;

    client_max_body_size 70m;
    client_body_timeout 60s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location ^~ /metrics/ {
        return 404;
    }

    location = /auth/discord/callback {
        # upstream 오류에도 OAuth code와 state가 로그에 남지 않게 한다.
        error_log /dev/null;
        proxy_pass $web_upstream;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
